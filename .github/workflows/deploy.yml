name: Deploy Azure (opcional)


on:
  workflow_run:
    workflows: ["Continuous Delivery"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Atualizar Azure Container App
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Verificar se o deploy está configurado
        id: check
        run: echo "enabled=${{ secrets.AZURE_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"

      - name: Definir tag da imagem
        if: steps.check.outputs.enabled == 'true'
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "IMAGE=docker.io/${{ vars.DOCKER_USER }}/confereai-api:${SHA::7}" >> "$GITHUB_ENV"

      - name: Azure Login
        if: steps.check.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Atualizar Container App
        if: steps.check.outputs.enabled == 'true'
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --image "$IMAGE"
            az containerapp show \
              --name "${{ vars.AZURE_CONTAINER_APP }}" \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --query "{name:name, status:properties.runningStatus, fqdn:properties.configuration.ingress.fqdn}" \
              --output table
