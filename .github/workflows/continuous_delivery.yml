name: Continuous Delivery

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: confereai-api

jobs:
  build_and_push:
    name: Build, testes e publicação no Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build e testes (Maven)
        run: mvn -B clean verify

      - name: Gerar tags da imagem
        run: |
          echo "VERSION=v${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build e push da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }}
            ${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest

      - name: Resumo
        run: |
          echo "### Imagem publicada no Docker Hub 🐳" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_SHA }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ vars.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
